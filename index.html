<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b2620"><title>Runes &amp; Ramparts</title></head>
<body><main id="app">
<header><div class="brand"><span class="crest">R<span>&amp;</span>R</span><div><h1>Runes &amp; Ramparts</h1><p>Глава I · Лесной рубеж</p></div></div><div class="head-actions"><button id="settings">Звук</button><button id="fullscreen">На весь экран</button></div></header>
<section class="hud"><div><small>Казна</small><strong id="gold">310</strong></div><div><small>Гарнизон</small><strong id="lives">20 / 20</strong></div><div><small>Волна</small><strong id="wave">0 / 12</strong></div><div><small>Очки</small><strong id="score">0</strong></div><div class="hud-actions"><button id="pause">Пауза</button><button id="speed">×1</button><button id="next" class="primary">Начать волну</button></div></section>
<section class="layout"><div class="battle"><div id="field"></div><div id="message" role="status">Выберите башню, затем свободное место на карте.</div><div class="toolbar" id="towerbar"></div></div><aside><div class="panel"><h2 id="panelTitle">Военный совет</h2><div id="details"></div></div><div class="panel"><h2>Разведка</h2><div id="forecast"></div></div><div class="panel record"><h2>Зал славы</h2><div id="records"></div></div></aside></section>
<footer><span>R&amp;R · 0.1.0 · ранняя сборка</span><div><button id="save">Сохранить</button><button id="export">Экспорт</button><button id="import">Импорт</button><button id="reset">Новая игра</button></div><input id="file" type="file" accept=".json,application/json" hidden></footer>
<dialog id="soundDialog"><h2>Звук и музыка</h2><label><input id="music" type="checkbox" checked> Музыка · оригинальный чиптюн</label><label><input id="sfx" type="checkbox" checked> Звуковые эффекты</label><label>Громкость <input id="volume" type="range" min="0" max="100" value="35"></label><button id="closeSettings" class="primary">Готово</button></dialog>
</main><script type="module" src="/src/main.ts"></script></body></html>
